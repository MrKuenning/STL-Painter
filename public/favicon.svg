<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="favRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Rounded Tile -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="1.5"/>

  <!-- 3D Base Cube -->
  <!-- Left Face -->
  <path d="M6 15 L16 21 L16 27 L6 21 Z" fill="#243044"/>
  <!-- Right Face -->
  <path d="M16 21 L26 15 L26 21 L16 27 Z" fill="#151d2a"/>
  <!-- Top Face Base -->
  <path d="M16 9 L26 15 L16 21 L6 15 Z" fill="#334155"/>

  <!-- Color Layers / Stripes -->
  <path d="M8 15 L12 12.6 L15 14.4 L11 16.8 Z" fill="#3b82f6"/>
  <path d="M11 16.8 L15 14.4 L18 16.2 L14 18.6 Z" fill="#10b981"/>
  <path d="M14 18.6 L18 16.2 L21 18 L17 20.4 Z" fill="#f59e0b"/>
  <path d="M12 12.6 L16 10.2 L19 12 L15 14.4 Z" fill="#ec4899"/>

  <!-- Curved Paint Stroke -->
  <path d="M9 16 C 13 19, 19 18, 23 14" stroke="url(#favRainbow)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Paint Brush / Tip -->
  <path d="M27 4 L29 6 L22 13 L20 11 Z" fill="#f1f5f9"/>
  <path d="M22 13 L20 11 L18 13 L20 15 Z" fill="#64748b"/>
  <path d="M18 13 L20 15 L16 17 Z" fill="#10b981"/>
  <circle cx="16" cy="17.5" r="1.2" fill="#34d399"/>
</svg>

